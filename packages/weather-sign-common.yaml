# Shared hardware + weather pipeline for the Seeed reTerminal E1001 weather sign.
#
# Everything both power modes have in common lives here exactly once:
# the board, the radios, the sensors, the e-paper panel and the weather import
# from Home Assistant. The two device files only describe what actually
# differs between them:
#
#   weather-sign.yaml        -> always on (WiFi stays up, HA stays connected)
#   weather-sign-sleep.yaml  -> deep sleep (radio off between refreshes)
#
# Weather data no longer comes from a weather API called by the ESP32. Home
# Assistant owns it (the official NWS integration in
# home-assistant/weather-sign.yaml) and this device imports the resulting
# entities over the native API. That keeps the API keys/User-Agents, retries,
# unit handling and forecast logic in one place on a machine that is always
# online, and lets the device stay a thin display.
#
# Because ESPHome merges package + device config with the *device* winning for
# scalars, each device file may override anything here. Lists are concatenated,
# so a component that must exist exactly once (display, time, interval) is
# deliberately NOT defined in this package when a device also defines it.
#
# Substitutions the including device file MUST define:
#   ${wifi_power_save_mode}        - none | light | high
#   ${weather_fetch_interval}      - how often the panel is refreshed from HA
#
# Secrets the including device file MUST provide (used through !secret below):
#   wifi_ssid, wifi_password, weather_sign__encryption_key,
#   weather_sign__ota_password
#
# The Home Assistant entity ids below are the defaults created by the HA
# package. If yours differ (or HA appended `_2`), change them here.

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

api:
  encryption:
    key: !secret weather_sign__encryption_key
ota:
  - platform: esphome
    password: !secret weather_sign__ota_password
web_server:
  port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # NOTE (battery): `power_save_mode: none` keeps the radio in active mode the
  # whole time. That is the single largest load on this battery device (tens of
  # mA vs a few mA with modem sleep) and is the most likely reason the pack
  # voltage "falls fast" overnight. It is kept here because the device was
  # originally reported offline with the default LIGHT power save. If the drop
  # is confirmed to be the battery dying (see the Last Reset Reason / Battery
  # Level entities), the real fix is deep sleep between refreshes; the
  # always-on alternative is to restore power_save_mode: light.
  #
  # The value is a substitution so the always-on build can flip it with a
  # one-line change (see weather-sign.yaml) without touching this package.
  power_save_mode: ${wifi_power_save_mode}
  # Reassociate without a full channel scan after any drop.
  fast_connect: true
  # Cap TX power. Transmit peaks are the biggest instantaneous load and are what
  # sag a weak cell into the brownout detector. With esp-idf, ESPHome also
  # lowers the PHY max TX power to match, which prevents brownout during PHY
  # init and OTA on a marginal supply. 13 dBm trades a little range for headroom
  # (allowed 8.5-20.5 dBm; lower = more headroom, higher = more range).
  output_power: 13dBm
  ap:
    ssid: aaa-broken-weather-sign
captive_portal:

debug:
  # Publishes the previous reset reason once at boot (brownout vs power-on vs
  # watchdog) as a Home Assistant entity; no periodic logging needed here.
  update_interval: never

i2c:
  sda: GPIO19
  scl: GPIO20
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

output:
  - platform: gpio
    pin: GPIO21
    id: battery_enable
  # Onboard status LED. Seeed's reTerminal E-series ESPHome cookbook lists the
  # E1001/E1002 onboard LED on GPIO6, active-low (inverted: true). The panel
  # itself uses CS/DC/RST/BUSY = GPIO10/11/12/13, so GPIO6 is free.
  - platform: gpio
    pin:
      number: GPIO6
      inverted: true
    id: status_led

font:
  - file: "gfonts://Inter"
    id: font_small
    size: 24
  - file: "gfonts://Inter@600"
    id: font_med
    size: 36
  - file: "gfonts://Inter@700"
    id: font_big
    size: 72
  - file: "gfonts://JetBrains Mono"
    id: font_mono
    size: 24

image:
  - platform: file
    defaults:
      type: BINARY
      transparency: chroma_key
      resize: 64x64
    files:
      - file: mdi:weather-sunny
        id: icon_sunny
      - file: mdi:weather-night
        id: icon_clear_night
      - file: mdi:weather-partly-cloudy
        id: icon_partly
      - file: mdi:weather-cloudy
        id: icon_cloudy
      - file: mdi:weather-fog
        id: icon_fog
      - file: mdi:weather-pouring
        id: icon_rain
      - file: mdi:weather-lightning-rainy
        id: icon_storm
      - file: mdi:weather-snowy
        id: icon_snow
      - file: mdi:weather-windy
        id: icon_wind
# Hero (current-condition) icons, large to match 72pt temperature
  - platform: file
    defaults:
      type: BINARY
      transparency: chroma_key
      resize: 140x140
    files:
      - file: mdi:weather-sunny
        id: hero_sunny
      - file: mdi:weather-night
        id: hero_clear_night
      - file: mdi:weather-partly-cloudy
        id: hero_partly
      - file: mdi:weather-cloudy
        id: hero_cloudy
      - file: mdi:weather-fog
        id: hero_fog
      - file: mdi:weather-pouring
        id: hero_rain
      - file: mdi:weather-lightning-rainy
        id: hero_storm
      - file: mdi:weather-snowy
        id: hero_snow

# Weather state is imported from Home Assistant (see
# home-assistant/weather-sign.yaml). These are read-only mirrors; `internal`
# defaults to true, so they do not get published back to HA.
text_sensor:
  - platform: homeassistant
    id: wx_condition
    entity_id: sensor.weather_sign_condition
  # All three forecast days arrive as one "Day|hi|lo|code;..." attribute. It
  # is one entity to watch instead of three, and the display splits it below.
  - platform: homeassistant
    id: fcst_all
    entity_id: sensor.weather_sign_forecast
    attribute: days
  - platform: homeassistant
    id: sun_rise
    entity_id: sensor.weather_sign_sunrise
  - platform: homeassistant
    id: sun_set
    entity_id: sensor.weather_sign_sunset
  # Why the device rebooted last time. "brownout" here confirms the low-voltage
  # theory; "power-on event" with a low battery points at the pack dying.
  - platform: debug
    reset_reason:
      name: Last Reset Reason

sensor:
  - platform: homeassistant
    id: wx_temp
    entity_id: sensor.weather_sign_temperature
    unit_of_measurement: °F
  - platform: homeassistant
    id: wx_humidity
    entity_id: sensor.weather_sign_humidity
    unit_of_measurement: "%"
  - platform: homeassistant
    id: wx_wind
    entity_id: sensor.weather_sign_wind_speed
    unit_of_measurement: mph
  - platform: sht4x
    address: 0x44
    temperature:
      name: Room Temperature
      id: room_temp
    humidity:
      name: Room Humidity
      id: room_hum
  - platform: adc
    pin: GPIO1
    id: batt_v
    name: Battery Voltage
    attenuation: 12db
    update_interval: 60s
    filters:
      # x2 undoes the on-board divider (VBAT_ADC is half the pack voltage).
      # Median smooths WiFi-TX sag so a momentary dip does not read as a real
      # "fast fall" on the Home Assistant graph.
      - multiply: 2.0
      - median:
          window_size: 5
          send_every: 5
  # No fuel-gauge IC is exposed in ESPHome on this board, so percentage is a
  # linear fit of the crude ADC voltage (indicative, not coulomb-accurate):
  # ~3.30 V = empty, ~4.15 V = full for a Li-ion cell.
  - platform: template
    id: batt_pct
    name: Battery Level
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      const float v = id(batt_v).state;
      if (isnan(v)) return NAN;
      return (v - 3.30f) / (4.15f - 3.30f) * 100.0f;
    filters:
      - clamp:
          min_value: 0
          max_value: 100

script:
  - id: wx_fetch
    then:
      # Survive a sagging battery: below ~3.30 V skip the radio burst and hold
      # the last image rather than adding a current spike that can trip the
      # brownout detector. The panel's own update_interval still runs, so the
      # display is never frozen.
      - if:
          condition:
            lambda: return !isnan(id(batt_v).state) && id(batt_v).state < 3.30f;
          then:
            - logger.log:
                level: WARN
                format: "Battery low (%.2f V): skipping weather refresh"
                args: ['id(batt_v).state']
          else:
            # Home Assistant pushes entity updates over the native API. After a
            # deep-sleep wake the API connection can take a few seconds to come
            # up and HA then sends the current values, so wait for the two
            # entities that matter before touching the panel. The timeout keeps
            # a missing HA from holding the device awake forever.
            - wait_until:
                condition:
                  lambda: return id(wx_temp).has_state() && !isnan(id(wx_temp).state) && id(fcst_all).has_state() && !id(fcst_all).state.empty();
                timeout: 25s
            - if:
                condition:
                  lambda: return id(wx_temp).has_state() && !isnan(id(wx_temp).state) && id(fcst_all).has_state() && !id(fcst_all).state.empty();
                then:
                  # (battery) Separate the HA/WiFi update burst from the
                  # e-paper refresh. The panel pulls ~20-30 mA for ~20 s while
                  # it drives the pixels, and the WiFi stack is still pushing
                  # ACKs out of the radio at the same time. Overlapping the two
                  # peaks is what drags a sagging pack under the brownout
                  # threshold, so let the radio settle first.
                  - delay: 2s
                  - component.update: epaper
                else:
                  - logger.log:
                      level: WARN
                      format: "Home Assistant weather entities not ready; keeping the last panel image"

display:
  - platform: epaper_spi
    id: epaper
    model: Seeed-reTerminal-E1001
    update_interval: 15min
    full_update_every: 8
    rotation: 0°
    lambda: |-
      it.fill(Color::WHITE);
      const int W = it.get_width();
      // ESPHome mirrors HA's "unavailable"/"unknown" strings verbatim for text
      // sensors; treat those as no data rather than rendering them.
      auto valid_text = [](const std::string &s) {
        return !s.empty() && s != "unavailable" && s != "unknown";
      };
      // Faux-grayscale: panel driver is binary-only (no 4-level gray in ESPHome),
      // so hierarchy comes from dotted rules + inverted badge instead of gray fills.
      // Header: "October 13th" left, time top-right
      if (id(sntp_time).now().is_valid()) {
        auto t = id(sntp_time).now();
        const char *months[] = {"", "January", "February", "March", "April", "May", "June",
          "July", "August", "September", "October", "November", "December"};
        int d = t.day_of_month;
        const char *suf = "th";
        if (d % 10 == 1 && d != 11) suf = "st";
        else if (d % 10 == 2 && d != 12) suf = "nd";
        else if (d % 10 == 3 && d != 13) suf = "rd";
        it.printf(20, 10, id(font_med), Color::BLACK, TextAlign::TOP_LEFT,
          "%s %d%s", months[t.month], d, suf);
        // Time plain top-right
        it.printf(W - 20, 10, id(font_small), Color::BLACK, TextAlign::TOP_RIGHT,
          "%02d:%02d", t.hour, t.minute);
      } else {
        it.print(20, 10, id(font_med), Color::BLACK, TextAlign::TOP_LEFT, "--");
      }
      // Indoor moved to bottom-right (see below).
      // Dotted rule (stipple = faux gray): dots every 6px instead of solid line
      for (int x = 20; x < W - 20; x += 6) it.filled_circle(x, 62, 1, Color::BLACK);
      if (id(wx_condition).has_state() && valid_text(id(wx_condition).state)) {
        std::string c = id(wx_condition).state;
        auto *icon = &id(hero_cloudy);
        const char *friendly = "Cloudy";
        if (c=="sunny") { icon = &id(hero_sunny); friendly = "Sunny"; }
        else if (c=="clear-night") { icon = &id(hero_clear_night); friendly = "Clear Night"; }
        else if (c=="partlycloudy") { icon = &id(hero_partly); friendly = "Partly Cloudy"; }
        else if (c=="cloudy") { icon = &id(hero_cloudy); friendly = "Cloudy"; }
        else if (c=="fog") { icon = &id(hero_fog); friendly = "Fog"; }
        else if (c=="rainy") { icon = &id(hero_rain); friendly = "Rain"; }
        else if (c=="storm") { icon = &id(hero_storm); friendly = "Storm"; }
        else if (c=="snowy") { icon = &id(hero_snow); friendly = "Snow"; }
        it.image(30, 90, *icon, Color::BLACK, COLOR_OFF);
        it.print(190, 100, id(font_small), Color::BLACK, TextAlign::TOP_LEFT, friendly);
      }
      if (id(wx_temp).has_state() && !isnan(id(wx_temp).state)) {
        it.printf(190, 140, id(font_big), Color::BLACK, TextAlign::TOP_LEFT, "%.0fF", id(wx_temp).state);
        // Humidity/wind are optional: if the source omits them, show "--"
        // instead of printf'ing nan.
        char hum[8] = "--";
        char wind[16] = "--";
        if (id(wx_humidity).has_state() && !isnan(id(wx_humidity).state)) snprintf(hum, sizeof(hum), "%.0f%%", id(wx_humidity).state);
        if (id(wx_wind).has_state() && !isnan(id(wx_wind).state)) snprintf(wind, sizeof(wind), "%.0f mph", id(wx_wind).state);
        it.printf(190, 230, id(font_small), Color::BLACK, TextAlign::TOP_LEFT,
          "H %s  Wind %s", hum, wind);
      } else {
        it.print(180, 140, id(font_big), Color::BLACK, TextAlign::TOP_LEFT, "--F");
      }
      if (id(sun_rise).has_state() && id(sun_set).has_state() &&
          valid_text(id(sun_rise).state) && valid_text(id(sun_set).state)) {
        it.printf(W - 20, 100, id(font_mono), Color::BLACK, TextAlign::TOP_RIGHT,
          "^%s", id(sun_rise).state.c_str());
        it.printf(W - 20, 140, id(font_mono), Color::BLACK, TextAlign::TOP_RIGHT,
          "v%s", id(sun_set).state.c_str());
      } // e.g. ^6:58a / v7:12p, right of hero
      for (int x = 20; x < W - 20; x += 6) it.filled_circle(x, 280, 1, Color::BLACK);
      // Forecast row: fixed slots, icon 64px, temps BELOW icon with gap. No overlap by construction.
      // Row budget: badge 288-318, icon 324-388, temps 394, footer 440, indoor 444-478.
      int colx[3] = {60, 310, 560};
      // All three days arrive in one "Day|hi|lo|code;Day|hi|lo|code;..." string
      // from Home Assistant (see home-assistant/weather-sign.yaml), so split
      // it into the same three slots the renderer has always used.
      std::string raws[3];
      {
        std::string all = id(fcst_all).state;
        if (!valid_text(all)) all.clear();
        size_t pos = 0;
        for (int i = 0; i < 3; i++) {
          size_t nxt = all.find(';', pos);
          raws[i] = all.substr(pos, nxt == std::string::npos ? std::string::npos : nxt - pos);
          if (nxt == std::string::npos) break;
          pos = nxt + 1;
        }
      }
      for (int i = 0; i < 3; i++) {
        std::string s = raws[i];
        if (s.empty()) {
          it.print(colx[i], 288, id(font_small), Color::BLACK, TextAlign::TOP_LEFT, "--");
          continue;
        }
        // split on '|'
        std::string parts[4]; int pi = 0;
        size_t pos = 0, nxt;
        while (pi < 3 && (nxt = s.find('|', pos)) != std::string::npos) {
          parts[pi++] = s.substr(pos, nxt - pos); pos = nxt + 1;
        }
        parts[pi] = s.substr(pos);
        int hi = atoi(parts[1].c_str()); int lo = atoi(parts[2].c_str());
        int dc = atoi(parts[3].c_str());
        // Day plain, no badge
        it.print(colx[i], 288, id(font_small), Color::BLACK, TextAlign::TOP_LEFT, parts[0].c_str());
        auto *fic = &id(icon_cloudy);
        if (dc == 0) fic = &id(icon_sunny);
        else if (dc == 1) fic = &id(icon_partly);
        else if (dc <= 3) fic = &id(icon_cloudy);
        else if (dc <= 48) fic = &id(icon_fog);
        else if (dc <= 67) fic = &id(icon_rain);
        else if (dc <= 77) fic = &id(icon_snow);
        else if (dc <= 82) fic = &id(icon_rain);
        else if (dc <= 86) fic = &id(icon_snow);
        else fic = &id(icon_storm);
        it.image(colx[i], 324, *fic, Color::BLACK, COLOR_OFF);
        it.printf(colx[i], 394, id(font_small), Color::BLACK, TextAlign::TOP_LEFT,
          "%d/%dF", hi, lo);
        if (i < 2) {
          // dotted vertical divider = lighter than solid rule
          for (int y = 288; y < 432; y += 6) it.filled_circle(colx[i] + 190, y, 1, Color::BLACK);
        }
      }
      for (int x = 20; x < W - 20; x += 6) it.filled_circle(x, 438, 1, Color::BLACK);
      // Bottom strip: indoor temp/humidity, own reserved band 442-478, never touched by forecast
      if (id(room_temp).has_state()) {
        it.printf(W - 20, 444, id(font_mono), Color::BLACK, TextAlign::TOP_RIGHT,
          "%.0fF %.0f%%", id(room_temp).state * 9.0 / 5.0 + 32.0, id(room_hum).state);
      }
