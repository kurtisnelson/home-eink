# reTerminal E1001 weather sign - ALWAYS ON build.
#
# This is the "connected" build: the radio stays up, Home Assistant stays
# connected, the panel refreshes itself every 15 minutes and the forecast is
# refetched on a timer.
#
# Battery notes for this build:
#   * The radio is the whole budget. With `wifi_power_save_mode: none` the
#     ESP32-S3 keeps its WiFi in active mode continuously, which is tens of
#     mA. Everything else on this board (e-paper, SHT40, ADC) is noise next to
#     that. A 2000 mAh pack therefore lasts hours-to-a-day here, not weeks.
#   * The real fix for runtime is the sibling build, weather-sign-sleep.yaml,
#     which sleeps between refreshes. Switch the "Sleep Mode" switch off in
#     Home Assistant to keep this always-on behaviour on the sleep hardware.
#
# See packages/weather-sign-common.yaml for everything both builds share.

substitutions:
  name: weather-sign
  friendly_name: Weather Sign
  latitude: !secret latitude
  longitude: !secret longitude
  # (battery) none keeps the radio in active mode all the time - the most
  # reliable setting, and the one this device was reported offline with when
  # it was LIGHT. light drops the radio into modem sleep between beacons and
  # is the single biggest saving available to the always-on build (tens of mA
  # down to a few mA), at the cost of a higher chance of dropped packets /
  # slow reconnection on a weak signal. Try it with a spare battery first;
  # switching it back is a one-line change.
  wifi_power_save_mode: none
  # How often the forecast is refetched. 30min is a good balance; the panel
  # itself still redraws every 15min (see the display update_interval in the
  # package) so the clock on the sign stays fresh.
  weather_fetch_interval: 30min
  nws_user_agent: "home-eink-weather-sign (https://github.com/kurtisnelson/home-eink)"
  # Nearest NWS observation station. KSFO is San Francisco Intl.; change it
  # with the location. NWS is primary and Open-Meteo is the fallback.
  nws_station: KSFO

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    # 600: bring the status LED up before WiFi/display come online. If the board
    # ever crashes or reboot-loops before it can draw, the LED simply stays on,
    # which makes a failed boot obvious on the bench.
    - priority: 600
      then:
        - output.turn_on: battery_enable
        - output.turn_on: status_led
    # -100 runs after every component is set up. The e-paper driver is a
    # non-blocking state machine and ESPHome exposes no "refresh complete"
    # trigger (component.update returns immediately), so hold the LED through
    # the first refresh and then switch it off after a full 800x480 refresh
    # comfortably completes.
    - priority: -100
      then:
        - delay: 30s
        - output.turn_off: status_led

logger:
  # INFO is enough to follow the device day to day. The one thing that really
  # matters for an overnight failure - the reset reason (rst:0x... e.g.
  # BROWNOUT / RTCWDT / TG0WDT) - is printed by the ROM boot banner and is
  # also published as the "Last Reset Reason" entity, so dropping DEBUG here
  # does not lose the diagnosis. Set it back to DEBUG if you are chasing
  # something specific (it costs a little UART traffic and CPU time).
  level: INFO

time:
  - platform: sntp
    id: sntp_time
    timezone: America/Los_Angeles
    servers:
      - pool.ntp.org
    on_time_sync:
      then:
        - component.update: epaper

interval:
  - interval: ${weather_fetch_interval}
    startup_delay: 15s
    then:
      - script.execute: wx_fetch

binary_sensor:
  # The button on the back of the sign: a manual refresh, for when the
  # forecast on the panel is older than you would like.
  - platform: gpio
    pin:
      number: GPIO3
      inverted: true
      mode: INPUT_PULLUP
    id: btn_refresh
    internal: true
    on_press:
      then:
        - script.execute: wx_fetch

packages:
  common: !include packages/weather-sign-common.yaml
