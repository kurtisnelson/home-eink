name: Validate ESPHome YAML

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: YAML syntax check (handles ESPHome !secret tags)
        run: |
          python3 - <<'EOF'
          import glob, re, sys
          try:
              import yaml
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, "-m", "pip", "install", "pyyaml"])
              import yaml
          # Treat ESPHome custom tags (!secret, !include, !lambda, etc.) as plain scalars
          yaml.SafeLoader.add_multi_constructor("!", lambda loader, suffix, node: (
              loader.construct_scalar(node) if isinstance(node, yaml.ScalarNode)
              else loader.construct_sequence(node) if isinstance(node, yaml.SequenceNode)
              else loader.construct_mapping(node)
          ))
          files = sorted(glob.glob("**/*.yaml", recursive=True) + glob.glob("**/*.yml", recursive=True))
          if not files:
              print("No YAML files found")
              sys.exit(1)
          for f in files:
              with open(f) as fh:
                  yaml.safe_load(fh)
              print(f"OK: {f}")
          EOF
      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_file: .yamllint

  esphome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # ESPHome 2026.9+ requires Python >= 3.12 and knows the
          # Seeed-reTerminal-E1001 display model used here
          python-version: '3.13'
      - name: Install ESPHome
        run: pip install esphome==2026.9.1
      - name: Validate ESPHome config
        run: |
          # CI has no real secrets.yaml; supply plausible dummies for validation only.
          # Never overwrite a real secrets file if one exists.
          if [ ! -f secrets.yaml ]; then
            DUMMY_KEY=$(python3 -c "import base64, os; print(base64.b64encode(os.urandom(32)).decode())")
            cat > secrets.yaml <<EOF
          latitude: "37.7749"
          longitude: "-122.4194"
          weather_sign__encryption_key: "$DUMMY_KEY"
          weather_sign__ota_password: "dummy-ota-password"
          wifi_ssid: "dummy-ssid"
          wifi_password: "dummy-password"
          EOF
          fi
          esphome config weather-sign.yaml
          esphome config weather-sign-sleep.yaml
